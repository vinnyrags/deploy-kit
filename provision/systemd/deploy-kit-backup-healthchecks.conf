# deploy-kit — dead-man's switch for the nightly backup, installed by
# `backup.sh --healthchecks`. A healthchecks.io check expects a ping every 24 h (+ grace)
# and emails when one is missing or a /fail arrives. The ping URL is a secret — anyone
# holding it can fake a success — so it lives in a root-only env file, never here.
# Pings are best-effort ("-"): an unreachable healthchecks never fails the backup; the
# missing ping is the alarm.
[Service]
EnvironmentFile=@ENV_FILE@
ExecStartPre=-/usr/bin/curl -fsS -m 10 --retry 3 -o /dev/null ${HC_URL}/start
ExecStartPost=-/usr/bin/curl -fsS -m 10 --retry 5 -o /dev/null ${HC_URL}
ExecStopPost=-/bin/sh -c 'if [ "$SERVICE_RESULT" != "success" ]; then /usr/bin/curl -fsS -m 10 --retry 5 -o /dev/null "$HC_URL/fail"; fi'
