# deploy-kit — refuse requests that did not come through Cloudflare. Installed by
# provision/harden.sh to /etc/nginx/snippets/cloudflare-only.conf; $from_cloudflare is
# defined by the generated conf.d/00-cloudflare-geo.conf (same ranges as real-ip).
#
# Opt-in, per vhost, and ONLY in the 443 server block of a host that is proxied
# (orange cloud) in Cloudflare:
#
#     include snippets/cloudflare-only.conf;
#
# Why: when the security headers, CSP, WAF and rate limits live at the Cloudflare edge,
# a request sent straight to the droplet's IP skips every one of them. This closes that
# path for the hosts that opt in, without firewalling the whole IP — which would cut off
# grey-cloud hosts on the same droplet (the satis registry at packages.* is one).
#
# Never include it in:
#   - a DNS-only (grey cloud) host — every request would get 444;
#   - the port-80 server — certbot's HTTP-01 renewal and the https redirect live there.
#
# Known limit: any Cloudflare customer can route a request to this IP through their own
# zone and pass this check. Per-hostname Authenticated Origin Pulls closes that too.
#
# 444 closes the connection without a response, so a scanner learns nothing.
if ($from_cloudflare = 0) { return 444; }
