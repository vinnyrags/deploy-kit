# deploy-kit — FastCGI micro-cache resilience. Installed by provision/harden.sh to
# /etc/nginx/snippets/wp-microcache.conf. Opt-in: include it INSIDE a vhost's
# `location ~ \.php$` block, next to its fastcgi_cache directives:
#
#     include snippets/wp-microcache.conf;
#
# A 30-second micro-cache without these has two failure modes:
#
#   - Every 30s an entry expires and the next visitor waits for a full PHP render;
#     when several arrive together they ALL go to PHP-FPM (a stampede). On a 1 vCPU
#     droplet that is the cache creating load spikes instead of absorbing them.
#   - When PHP-FPM is down or erroring, the site is down, although nginx holds a
#     perfectly good copy of every recent page.
#
# use_stale + background_update: serve the expired copy instantly and refresh it with
# one background subrequest. lock: while an entry is being filled, other requests for
# the same key wait for it (up to lock_timeout) instead of piling onto PHP-FPM.
# error/timeout/http_500/http_503: if PHP fails, serve the last good page — for as long
# as the zone keeps it (the zone's `inactive=`, 60m in the kit template).
#
# Only anonymous, cacheable responses are affected: anything $skip_cache bypasses
# (logged-in, POST, wp-admin, query strings) never touches the cache, stale or not.
# Observe with X-FastCGI-Cache: STALE / UPDATING.
fastcgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
fastcgi_cache_background_update on;
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 5s;
