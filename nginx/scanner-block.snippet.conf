# deploy-kit — reject scanner traffic in nginx, before it reaches PHP. Installed by
# provision/harden.sh to /etc/nginx/snippets/scanner-block.conf. Include it in each
# WordPress server block right AFTER wp-hardening.conf (and so before the generic
# `location ~ \.php$` — regex locations are first-match):
#
#     include snippets/wp-hardening.conf;
#     include snippets/scanner-block.conf;
#
# `harden.sh --scanner-block` inserts it for you; new-site.sh vhosts carry it already.
#
# Why: with no page cache in front of an unmatched path, `try_files` hands it to
# index.php and WordPress boots fully just to answer 404. On a small droplet that is
# real capacity — on one site in the fleet ~30% of requests were vulnerability probes
# (.env files, Laravel Ignition, Spring heapdumps, MCP endpoints, phpunit eval-stdin),
# each costing a PHP-FPM worker that a visitor was waiting for. A page cache does not
# help: probes are cache misses by nature.
#
# 444 closes the connection without a response — scanners get nothing to fingerprint.

# No User-Agent at all: scanners, not browsers. WordPress's own loopback, cron and
# site-health requests send "WordPress/<version>", and monitoring tools send one too.
if ($http_user_agent = "") {
    return 444;
}

# Dotfiles (.env, .git, .DS_Store, .aws …). .well-known stays reachable for ACME and
# security.txt.
location ~ /\.(?!well-known/) {
    return 444;
}

# The root Composer vendor/ sits in the docroot on Mythus sites: without this,
# /vendor/composer/installed.json lists every package and version, and
# /vendor/phpunit/… is a standing RCE probe target.
location ^~ /vendor/ {
    return 404;
}

# Probe paths for software these sites do not run. Anchored so a page slug that merely
# starts with the same letters (/mcpherson/, /backend-engineering/) is unaffected.
location ~* ^/(_ignition|actuator|SDK/|sse$|mcp(/|$)|laravel|backend/|cgi-bin/) {
    return 444;
}
location ~* heapdump {
    return 444;
}

# Static-looking files that don't exist: 404 from disk instead of booting WordPress
# (plugin readme.txt fingerprinting, .bak/.sql/.zip guesses). An exact-match
# `location = /robots.txt` outranks this regex, so WordPress keeps serving robots.txt.
location ~* \.(txt|bak|old|orig|save|swp|sql|zip|tar|gz|tgz|log|ini|ya?ml|conf)$ {
    try_files $uri =404;
    access_log off;
}
