# deploy-kit — standard WordPress FastCGI cache-skip rules. Include inside the
# `server { }` block of a WP vhost; it sets $skip_cache, which the cache directives
# in fastcgi-cache.conf read via fastcgi_cache_bypass / fastcgi_no_cache.
#
# Skips caching for: POST requests, any query string, admin/login/dynamic paths,
# and logged-in / commenter / password-protected cookies — i.e. never serve a
# cached page to someone who should see a personalized/fresh one.

set $skip_cache 0;

if ($request_method = POST) { set $skip_cache 1; }
if ($query_string != "")    { set $skip_cache 1; }

if ($request_uri ~* "/wp-admin/|/xmlrpc\.php|wp-.*\.php|/feed/|index\.php|sitemap(_index)?\.xml") {
    set $skip_cache 1;
}
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
    set $skip_cache 1;
}
