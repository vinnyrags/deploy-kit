# deploy-kit — canonical FastCGI micro-cache for a WordPress site.
# Replace <ZONE> (e.g. AVFTB) and <ZONE_DIR> (e.g. fastcgi-avftb) per site/env.
#
# Two parts:
#   1) the zone definition — goes in the http context (nginx.conf / conf.d), once per env
#   2) the cache directives — go inside the PHP `location ~ \.php$` block of the vhost
#
# KEY RULE: cache 200 + 404 ONLY, briefly. NEVER cache 301/302 — a cached redirect
# is how you get ERR_TOO_MANY_REDIRECTS. (This retires the stray `200 301 302 30m`
# lines found on some boxes.)

# --- (1) http context: one per environment -----------------------------------
# fastcgi_cache_path /var/cache/nginx/<ZONE_DIR> levels=1:2 keys_zone=<ZONE>:50m inactive=60m max_size=500m use_temp_path=off;

# --- (2) inside `location ~ \.php$` -------------------------------------------
# fastcgi_cache            <ZONE>;
# fastcgi_cache_key        "$scheme$request_method$host$request_uri";
# fastcgi_cache_valid      200 30s;     # short micro-cache — big perf win, low staleness
# fastcgi_cache_valid      404 5m;
# # (intentionally NO 301/302 — never cache redirects)
# fastcgi_cache_bypass     $skip_cache;
# fastcgi_no_cache         $skip_cache;
# add_header               X-FastCGI-Cache $upstream_cache_status;
