# deploy-kit — per-vhost WordPress hardening snippet. Installed to
# /etc/nginx/snippets/wp-hardening.conf and included from inside each server block
# by provision/harden.sh.
#
# This file exists only for rules that CANNOT live in http context. Anything that can
# go in conf.d/wp-security.conf should go there instead, because editing live vhosts
# means touching files certbot manages.

# --- login rate limiting: applied here, per-vhost -----------------------------------
#
# The zone is defined in conf.d/wp-security.conf; this is where it takes effect. It
# lives in the snippet rather than http context so that hardening one vhost does not
# silently harden every site on the droplet — see the note in that file.
#
# The map keys only wp-login.php, so this line is inert for every other request on
# the vhost. Rate and burst are tuned in conf.d/wp-security.conf.
limit_req zone=wp_login burst=10 nodelay;
limit_req_status 429;

# --- xmlrpc.php --------------------------------------------------------------------
#
# xmlrpc's system.multicall accepts many credential guesses in a SINGLE request, so it
# defeats request-rate limiting by design. Nothing in the Mythus/IX stack uses xmlrpc.
#
# Both paths are matched deliberately. vhost.conf.template historically blocked only
# `location = /xmlrpc.php`, which is correct for a classic layout but WRONG for the
# Bedrock-style layout where core lives in /wp — so /wp/xmlrpc.php stayed open and
# answering on every Mythus site while the rule looked present and correct.
#
# Regex (~) rather than exact (=) so one rule covers both. This must appear BEFORE the
# generic `location ~ \.php$` in the including server block; nginx evaluates regex
# locations in order of appearance and first match wins. harden.sh inserts the include
# at the top of the server block to guarantee that.
location ~ ^/(wp/)?xmlrpc\.php$ {
    deny all;
    access_log off;
    log_not_found off;
}

# --- PHP execution inside uploads ---------------------------------------------------
#
# A PHP file dropped into wp-content/uploads must never execute. Any file-upload
# weakness — a vulnerable plugin, or an account with media rights — otherwise becomes
# code execution.
#
# vhost.conf.template has carried this rule for a while, so the three Mythus sites had
# it. Shucked's vhost predates the template and did NOT: on 2026-08-25 a probe file
# written to its uploads directory executed and returned 200. Shucked also runs
# Forminator, a form plugin that accepts file uploads, so the vector was live rather
# than hypothetical.
#
# Sites generated from vhost.conf.template will now match this twice. That is
# harmless — nginx evaluates regex locations in order and the first wins, so the
# second is dead config, not a conflict.
location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
    access_log off;
    log_not_found off;
}

# --- /scripts/ ---------------------------------------------------------------------
#
# The repo root IS the docroot, so anything tracked lands in the web root. Operational
# scripts are now gitignored fleet-wide (/scripts/* in each site repo) and should never
# deploy — this is the belt-and-braces half, so a future `git add scripts/` cannot
# quietly re-expose them.
#
# It was not theoretical. On 2026-08-24 CBA served
# /scripts/sync-staging-cpts.sh at 200 — 6KB of plain text disclosing the database
# names, the non-default wp_ table prefix, and the path to /root/.db_credentials. The
# sibling .php files returned 500 rather than executing, but only by luck: they are
# `wp eval-file` style and fatal without WordPress loaded. One written the equally
# ordinary way, with `require wp-load.php` at the top, would have been an
# unauthenticated endpoint that mutates production.
#
# ^~ anchors at the URI root, so a child theme's own scripts/ directory
# (wp-content/themes/<child>/scripts/build-providers.config.js) is unaffected.
location ^~ /scripts/ {
    deny all;
    access_log off;
    log_not_found off;
}
